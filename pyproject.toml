[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anamorph-python"
version = "0.1.0"
description = "Experimental analytic neuron surface meshing from SWC morphologies"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only AND LicenseRef-AnaMorph-Attribution"
license-files = ["LICENSE", "COPYING", "NOTICE.md"]

[project.scripts]
anamorph = "anamorph.cli:main"

[tool.setuptools]
packages = ["anamorph"]
